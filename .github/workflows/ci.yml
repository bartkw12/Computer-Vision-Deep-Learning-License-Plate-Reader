name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # opencv-python links against libGL, which a headless runner may lack.
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1

      # The CPU-only PyTorch wheel is a fraction of the size of the CUDA one.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: README matches results
        run: python scripts/render_readme_tables.py --check

      # Tests marked "models" need downloaded weights and are run locally.
      - name: Test
        run: pytest -m "not models" --cov=alpr --cov-report=term-missing
